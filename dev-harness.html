<!DOCTYPE html>
<!--
  TEMPORARY local dev/test harness — NOT part of the shipped game.
  index.html only runs inside Perchance's own page shell, which injects
  `root` (kv storage + generateText/generateImage) and a couple of
  window.generatorPublicId/generatorIsUnsaved globals at runtime. Outside
  Perchance those don't exist, so index.html can't boot in a plain browser.

  This harness defines a minimal in-memory shim for exactly the surface
  src/src/srcfiles/state.js, src/src/srcfiles/llm.js, and src/src/srcfiles/image.js
  call, then fetches index.html
  itself (so the DOM/CSS/script list stay a single source of truth — this
  file never duplicates them) and replays its content into this page.
  Delete this file once the computer-UI rework is verified; it is a
  throwaway test tool, not a real save backend.
-->
<html>
<head>
<meta charset="utf-8">
<!-- Perchance's own page shell sets this (verified: width=device-width,
     initial-scale=1, interactive-widget=resizes-content); index.html is
     just a <body> fragment with no <head> of its own, so this harness
     has to supply an equivalent for local mobile-viewport testing to be
     representative at all. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>dev harness</title>
</head>
<body>
<!-- Local AI shim (src/src/dev/LOCAL-AI-SETUP.md): optional, off by default.
     local-ai.config.js doesn't exist until you copy it from the .example
     file, so this 404s silently on a fresh checkout and generateText/
     generateImage below fall through to their original stub-and-throw. -->
<script src="local-ai.config.js" onerror="console.warn('local-ai.config.js not found (copy local-ai.config.example.js to create it) — AI calls stay stubbed out.')"></script>
<script src="local-ai-shim.js"></script>
<script>
  // Bug report (2026-09-13): the original in-memory Map-backed kv wiped
  // every save on a page reload (any reload — a deliberate one to pick up
  // an edit, or an accidental F5), which real Perchance kv storage never
  // does. IndexedDB gives the exact same async get/set/update/delete/keys
  // surface but actually persists across reloads (and browser restarts),
  // scoped to this origin (http://localhost:PORT) — so each launch.json
  // port (8734/8735/8736/...) already gets its own separate, isolated save
  // data for free, matching how those configs were meant to be independent
  // test environments. Also stores Blobs natively (the images folder needs
  // this) via the structured clone algorithm, unlike localStorage.
  const KV_FOLDERS = [
    'meta', 'player', 'world', 'npcs', 'objects', 'images', 'snapshots',
    // Folders added to the game after this harness was first written.
    // Missing ones fail as `Cannot read properties of undefined (reading
    // 'get')` during boot, which reads like a game bug and isn't one —
    // keep this list in step with KVFolders in state.js.
    'menu', 'saves', 'saveIndex',
    // avatars-and-sprite-studio Phase 1: the permanent override store.
    'sprites',
  ];
  function openKvDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('slice-of-life-dev-harness', 1);
      req.onupgradeneeded = () => {
        for (const name of KV_FOLDERS) {
          if (!req.result.objectStoreNames.contains(name)) req.result.createObjectStore(name);
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  // Runs one request against `storeName` and resolves with ITS result
  // (not the transaction's) — request.onsuccess fires before tx.oncomplete
  // and already carries the value, so that's the one signal actually needed.
  async function runRequest(dbPromise, storeName, mode, fn) {
    const db = await dbPromise;
    return new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, mode);
      const req = fn(tx.objectStore(storeName));
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function makeFolder(dbPromise, storeName) {
    return {
      async get(key) { return runRequest(dbPromise, storeName, 'readonly', (store) => store.get(key)); },
      async set(key, val) {
        await runRequest(dbPromise, storeName, 'readwrite', (store) => store.put(val, key));
        return val;
      },
      async update(key, fn) {
        const cur = await this.get(key);
        const next = await fn(cur);
        await this.set(key, next);
        return next;
      },
      async delete(key) { await runRequest(dbPromise, storeName, 'readwrite', (store) => store.delete(key)); },
      async keys() { return runRequest(dbPromise, storeName, 'readonly', (store) => store.getAllKeys()); },
    };
  }
  const kvDbPromise = openKvDb();
  var root = {
    kv: Object.fromEntries(KV_FOLDERS.map((name) => [name, makeFolder(kvDbPromise, name)])),
    // Stubbed out by default — exercises the game's own existing fallback
    // paths (image.js's gradient placeholder, IM's broken-response
    // handling) rather than needing a hand-rolled fake LLM schema here.
    // Set LOCAL_AI_CONFIG.enabled = true (local-ai.config.js) to route
    // these at a real llama.cpp/ComfyUI box instead — see local-ai-shim.js.
    async generateText(arg) {
      if (window.LocalAI && window.LOCAL_AI_CONFIG && window.LOCAL_AI_CONFIG.enabled) {
        return window.LocalAI.generateText(arg);
      }
      throw new Error('dev-harness: generateText stubbed out');
    },
    async generateImage(prompt, opts) {
      if (window.LocalAI && window.LOCAL_AI_CONFIG && window.LOCAL_AI_CONFIG.enabled) {
        return window.LocalAI.generateImage(prompt, opts);
      }
      throw new Error('dev-harness: generateImage stubbed out');
    },
    // AfterHours' clip fetch. Real superFetch proxies a cross-origin GET;
    // locally that would just be a CORS failure, which only ever exercises
    // the error branch. Canned payload instead, shaped like the Pornhub
    // webmasters response fetchAfterHoursClips parses, so the grid, the
    // embed player and the masturbate/cum flow are all reachable in the
    // harness. One entry carries markup in its title on purpose — that's
    // the escaping regression test.
    async superFetch(url) {
      const n = 12;
      const videos = Array.from({ length: n }, (_, i) => ({
        title: i === 0 ? '<img src=x onerror="window.__XSS=1">pwn' : `Harness Clip ${i + 1}`,
        url: `https://www.pornhub.com/view_video.php?viewkey=ph000000${i}`,
        duration: `${5 + i}:0${i % 10}`,
        views: 1234567 - i * 98765,
        rating: 90 - i,
        default_thumb: '',
        thumbs: [],
      }));
      return { async json() { return { videos }; } };
    },
  };
  window.generatorPublicId = undefined;

  async function loadHarness() {
    const html = await (await fetch('index.html?t=' + Date.now(), { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');

    // Styles: copy both <style> blocks verbatim.
    for (const style of doc.querySelectorAll('style')) document.head.appendChild(style.cloneNode(true));

    // Markup: everything index.html has outside <style>/<script>/<template>
    // tags is the #app skeleton — append it as-is.
    for (const node of [...doc.body.childNodes]) {
      const tag = node.tagName;
      if (tag === 'SCRIPT') continue; // loaded below, in order
      document.body.appendChild(document.importNode(node, true));
    }

    // Scripts: index.html loads them via <script src>, in a documented
    // load-bearing order — replay that same order here, waiting for each
    // to finish before starting the next (classic scripts inserted via
    // createElement run async by default otherwise).
    const scriptTags = [...doc.querySelectorAll('script[src]')];
    const bust = Date.now(); // avoid a stale cached src/src/srcfiles/*.js across repeat test loads
    for (const tag of scriptTags) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        // index.html's src attributes carry their own ?v= cache-bust, so
        // append with the right separator rather than a second '?'.
        const rawSrc = tag.getAttribute('src');
        s.src = rawSrc + (rawSrc.includes('?') ? '&' : '?') + 't=' + bust;
        s.onload = resolve;
        s.onerror = () => reject(new Error('failed to load ' + s.src));
        document.body.appendChild(s);
      });
    }
  }
  loadHarness().catch(e => {
    document.body.insertAdjacentHTML('afterbegin', '<pre style="color:#f66;background:#000;padding:8px;">Harness load failed: ' + e.message + '</pre>');
    console.error(e);
  });
</script>
</body>
</html>
