<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    a { color: #f6a96c; } a:hover { color: #f6d76c; }
  </style>
</helmet>
<div style="position:relative;width:390px;height:844px;background:#120f1a;color:#e0e0f0;overflow:hidden;display:flex;flex-direction:column">

  <div style="padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;background:#181426;border-bottom:1px solid #3a3a5c">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8888aa;width:66px;flex-shrink:0">Detect</span>
      <div style="position:relative;flex-grow:1;height:14px;border-radius:4px;background:#2a2a4a;border:1px solid #3a3a5c;overflow:hidden">
        <div style="position:absolute;top:0;bottom:0;left:0;width:62%;background:linear-gradient(90deg,#b8455f,#f66c8c)"></div>
        <div style="position:absolute;top:0;bottom:0;left:0;width:24%;background:#6d1f36"></div>
        <div style="position:absolute;top:0;bottom:0;left:24%;width:2px;background:#e0e0f0;opacity:0.6"></div>
      </div>
      <span style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#f66c8c;width:24px;text-align:right">62</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#8888aa;width:66px;flex-shrink:0">Heat</span>
      <div style="position:relative;flex-grow:1;height:14px;border-radius:4px;background:#2a2a4a;border:1px solid #3a3a5c;overflow:hidden">
        <div style="position:absolute;top:0;bottom:0;left:0;width:48%;background:linear-gradient(90deg,#8e3f6b,#e26ca6)"></div>
      </div>
      <span style="font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;color:#e26ca6;width:24px;text-align:right">48</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center">
      <span style="font-size:11px;padding:3px 9px;border-radius:16px;background:rgba(246,108,140,0.12);border:1px solid #b8455f;color:#f66c8c">Panties</span>
      <span style="font-size:11px;padding:3px 9px;border-radius:16px;background:rgba(246,108,140,0.12);border:1px solid #b8455f;color:#f66c8c">Sheets</span>
      <span style="font-size:11px;color:#5a5a7c">left behind</span>
    </div>
  </div>

  <div style="position:relative;flex-grow:1;background:radial-gradient(120% 90% at 50% 30%,#3b3050 0%,#251e35 55%,#120f1a 100%)">
    <div style="position:absolute;inset:12px;border:1px dashed #3a3a5c;border-radius:8px;opacity:0.3"></div>
    <div style="position:absolute;top:22px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#5a5a7c">[ generated frame ]</div>

    <div style="position:absolute;top:56px;left:8px;right:8px">
      <svg viewBox="0 0 374 470" width="374" height="470" xmlns="http://www.w3.org/2000/svg">
        <rect x="8" y="8" width="358" height="454" rx="18" fill="rgba(20,16,29,0.30)" stroke="#3a3a5c"/>
        <g fill="rgba(123,108,246,0.08)" stroke="#4a4a7c" stroke-width="1.5">
          <rect x="128" y="24" width="118" height="76" rx="38"/>
          <rect x="112" y="110" width="150" height="86" rx="24"/>
          <rect x="118" y="206" width="138" height="70" rx="22"/>
          <rect x="116" y="376" width="142" height="60" rx="20"/>
        </g>
        <rect x="112" y="286" width="150" height="80" rx="22" fill="rgba(246,108,140,0.22)" stroke="#f66c8c" stroke-width="2.5"/>
        <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8888aa" text-anchor="middle">
          <text x="187" y="68">Face &amp; mouth</text>
          <text x="187" y="158">Chest</text>
          <text x="187" y="247">Stomach</text>
          <text x="187" y="332" fill="#f66c8c" font-weight="600">Between her legs</text>
          <text x="187" y="412">Thighs</text>
        </g>
        <g font-family="Segoe UI, system-ui, sans-serif" font-size="10" fill="#5a5a7c" text-anchor="middle">
          <text x="187" y="86">high</text>
          <text x="187" y="176">high</text>
          <text x="187" y="265">safe</text>
          <text x="187" y="350" fill="#f66c8c">+24–28 · heat +9 · leaves 2</text>
          <text x="187" y="428">moderate</text>
        </g>
        <text x="187" y="452" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#5a5a7c" text-anchor="middle">▾ swipe the map for calves, feet, back</text>
      </svg>
    </div>
  </div>

  <div style="padding:12px 16px;background:#181426;border-top:1px solid #3a3a5c;display:flex;flex-direction:column;gap:10px">
    <p style="margin:0;font-size:15px;line-height:1.6;color:#e0e0f0;min-height:48px;text-wrap:pretty">She shifts an inch toward your hand and settles again…</p>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
      <button style="height:48px;border:none;border-radius:8px;background:#7b6cf6;color:#fff;font-size:14px;font-weight:600;font-family:inherit">Quell −8–12</button>
      <button style="height:48px;border:1px solid #b8455f;border-radius:8px;background:rgba(246,108,140,0.10);color:#f66c8c;font-size:14px;font-weight:600;font-family:inherit">Cleanup · 2</button>
      <button style="height:48px;border:1px solid #3a3a5c;border-radius:8px;background:#2a2a4a;color:#8888aa;font-size:14px;font-weight:600;font-family:inherit">Slip out</button>
      <button style="height:48px;border:1px solid #4a4a7c;border-radius:8px;background:transparent;color:#f6a96c;font-size:14px;font-weight:600;font-family:inherit">Bail</button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
